<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書店進場專案管理</title>
<style>
:root{
  --bg:#f4f6fa;
  --card:#ffffff;
  --ink:#1f2937;
  --ink-soft:#5b6675;
  --line:#e3e8ef;
  --line-2:#eef1f6;
  --brand:#2563eb;
  --brand-soft:#eaf0ff;
  --gray:#9aa4b2;
  --gray-bg:#eef1f4;
  --blue:#2563eb;
  --blue-bg:#e3edff;
  --green:#16a34a;
  --green-bg:#e2f6e9;
  --amber:#d97706;
  --amber-bg:#fdf0dd;
  --red:#dc2626;
  --red-bg:#fdeaea;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.2px;}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--brand);text-decoration:none;}

/* ---------- App shell ---------- */
.app{max-width:1280px;margin:0 auto;padding:18px 20px 60px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 18px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand .logo{
  width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
  box-shadow:0 4px 10px rgba(37,99,235,.3);
}
.brand .t1{font-size:16px;font-weight:700;line-height:1.25;}
.brand .t2{font-size:12px;color:var(--ink-soft);}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:8px 14px;border-radius:9px;font-weight:600;transition:.15s;white-space:nowrap;
}
.btn:hover{background:#f7f9fc;border-color:#d3dbe6;}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.primary:hover{background:#1d4ed8;border-color:#1d4ed8;}
.btn.danger{background:#fff;border-color:#f1c6c6;color:var(--red);}
.btn.danger:hover{background:var(--red-bg);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:8px 10px;}
.btn.ghost:hover{background:#f1f4f9;color:var(--ink);}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}
.section-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.section-title .sub{font-size:12px;color:var(--ink-soft);font-weight:400;}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand);}
.kpi.k2::before{background:var(--blue);}
.kpi.k3::before{background:var(--green);}
.kpi.k4::before{background:#8b5cf6;}
.kpi .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.kpi .val{font-size:30px;font-weight:800;line-height:1.2;margin-top:4px;letter-spacing:.5px;}
.kpi .val small{font-size:15px;font-weight:700;color:var(--ink-soft);margin-left:2px;}
.kpi .foot{font-size:11.5px;color:var(--gray);margin-top:2px;}

/* ---------- Toolbar ---------- */
.toolbar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--line-2);
}
.toolbar .grow{flex:1;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.input,select.input,textarea.input{
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;outline:none;transition:.15s;width:100%;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.search{position:relative;min-width:230px;}
.search input{padding-left:32px;}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:13px;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table.tbl{width:100%;border-collapse:collapse;min-width:980px;}
table.tbl th{
  text-align:left;font-size:12px;color:var(--ink-soft);font-weight:700;
  padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap;
}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
table.tbl tbody tr{cursor:pointer;transition:.12s;}
table.tbl tbody tr:hover{background:#f7faff;}
table.tbl tbody tr:last-child td{border-bottom:none;}
.case-no{font-weight:700;color:var(--brand);white-space:nowrap;}
.cust{font-weight:600;}
.muted{color:var(--ink-soft);font-size:12.5px;}

/* ---------- Progress bars ---------- */
.pbar{background:var(--gray-bg);border-radius:99px;height:8px;overflow:hidden;position:relative;min-width:90px;}
.pbar > i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .3s ease;}
.pbar-wrap{display:flex;align-items:center;gap:9px;}
.pbar-val{font-size:12px;font-weight:700;color:var(--ink-soft);min-width:38px;text-align:right;font-variant-numeric:tabular-nums;}
.pbar.lg{height:10px;}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;}
.badge.gray{background:var(--gray-bg);color:#5b6675;}
.badge.blue{background:var(--blue-bg);color:#1d4ed8;}
.badge.green{background:var(--green-bg);color:#15803d;}
.badge.amber{background:var(--amber-bg);color:#b45309;}
.badge.red{background:var(--red-bg);color:#b91c1c;}
.badge.purple{background:#f1eaff;color:#6d28d9;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

/* ---------- Status switch (3-way) ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;}
.seg button{
  border:0;background:#fff;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--ink-soft);
  border-right:1px solid var(--line-2);transition:.12s;
}
.seg button:last-child{border-right:0;}
.seg button:hover{background:#f6f8fb;}
.seg button.on[data-s="none"]{background:var(--gray-bg);color:#4b5563;}
.seg button.on[data-s="wip"]{background:var(--blue-bg);color:#1d4ed8;}
.seg button.on[data-s="done"]{background:var(--green-bg);color:#15803d;}

/* ---------- Stage accordion ---------- */
.stage{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff;}
.stage-head{
  display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer;user-select:none;
  background:#fbfcfe;transition:.12s;flex-wrap:wrap;
}
.stage-head:hover{background:#f5f8fd;}
.stage-head .num{
  width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;
}
.stage-head .name{font-weight:700;font-size:14.5px;flex:0 0 auto;}
.stage-head .sp{flex:1;}
.stage-head .arrow{color:var(--gray);transition:transform .2s;font-size:12px;}
.stage.open .stage-head .arrow{transform:rotate(90deg);}
.stage-body{display:none;border-top:1px solid var(--line-2);}
.stage.open .stage-body{display:block;}

.step-row{
  display:grid;grid-template-columns:34px 1fr 250px 170px 150px;gap:12px;align-items:center;
  padding:10px 16px;border-bottom:1px solid var(--line-2);
}
.step-row:last-child{border-bottom:none;}
.step-row:hover{background:#fbfcff;}
.step-row .idx{font-size:12px;color:var(--gray);font-weight:700;text-align:center;}
.step-row .txt{font-size:13.5px;}
.step-row .txt .due{font-size:11.5px;color:var(--gray);}
.step-row input.dt{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;background:#fff;width:100%;}
.step-row input.own{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;background:#fff;width:100%;}
.step-row input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.step-row.is-done{background:#f6fdf8;}
.step-row.is-wip{background:#f7faff;}
.overdue-txt{color:var(--red);font-weight:700;}

/* ---------- Detail header / form ---------- */
.detail-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.detail-head .back{cursor:pointer;}
.grid-form{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-form .full{grid-column:1 / -1;}
.charts-2{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:stretch;}
.donut-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.donut-wrap svg{display:block;}
.donut-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--ink-soft);}
.donut-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}
.bar-chart{width:100%;}
.bar-row{display:grid;grid-template-columns:118px 1fr 52px;gap:10px;align-items:center;padding:6px 0;}
.bar-row .bl{font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-row .bv{font-size:12.5px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;}
.stack{display:flex;flex-direction:column;gap:18px;}

/* ---------- Modal ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(2px);
}
.modal-mask.show{display:flex;}
.modal{
  background:#fff;border-radius:16px;max-width:600px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);
  max-height:90vh;overflow:auto;animation:pop .18s ease-out;
}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:10px;background:#fafbfd;border-radius:0 0 16px 16px;}
.modal-foot.left{justify-content:space-between;}
.x{cursor:pointer;color:var(--gray);font-size:20px;line-height:1;border:0;background:none;}
.x:hover{color:var(--ink);}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.empty .big{font-size:38px;margin-bottom:10px;opacity:.5;}

/* ---------- Misc ---------- */
.hint{font-size:12px;color:var(--gray);}
.divider{height:1px;background:var(--line-2);margin:16px 0;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:11.5px;padding:2px 9px;border-radius:99px;background:#f2f4f8;color:var(--ink-soft);font-weight:600;}
.kv{display:grid;grid-template-columns:112px 1fr;gap:6px 12px;font-size:13px;}
.kv .k{color:var(--ink-soft);font-weight:600;}
.hid{display:none !important;}
.scroll-y{max-height:340px;overflow-y:auto;}

@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .grid-form{grid-template-columns:repeat(2,1fr);}
  .charts-2{grid-template-columns:1fr;}
  .step-row{grid-template-columns:30px 1fr;grid-auto-rows:auto;row-gap:8px;}
  .step-row .cell-seg,.step-row .cell-own,.step-row .cell-due{grid-column:2;}
}
@media (max-width:640px){
  .app{padding:12px;}
  .kpis{grid-template-columns:1fr;}
  .grid-form{grid-template-columns:1fr;}
  .brand .t2{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">書</div>
      <div>
        <div class="t1">書店進場專案管理</div>
        <div class="t2">Bookstore Onboarding Project Tracker</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnHome">← 回首頁</button>
      <button class="btn" id="btnExport">匯出備份</button>
      <button class="btn" id="btnImport">匯入備份</button>
      <button class="btn primary" id="btnNew">＋ 新增案件</button>
    </div>
  </header>

  <main id="view"></main>

  <div class="hint" style="text-align:center;margin-top:26px;">
    資料自動儲存於本機瀏覽器（localStorage）。建議定期使用「匯出備份」保存 JSON 檔。
  </div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" class="hid">

<script>
/* ===== APP CODE START ===== */

/* =========================================================
   1. 資料模型：9 階段與步驟
   ========================================================= */
const STAGE_DEFS = [
  { name: "營業", steps: [
    "客戶聯繫", "初步需求確認", "文件蒐集", "可行性評估", "建立案件編號", "安排營業會議"
  ]},
  { name: "提案", steps: [
    "安排營業會議", "需求與預算確認", "報價估算", "提案簡報製作", "客戶提案說明", "修正與確認"
  ]},
  { name: "簽約", steps: [
    "提供草約", "確認付款條件", "法務審閱", "條款調整", "內部捺印申請", "雙方簽署", "簽約金請款"
  ]},
  { name: "行銷授權", steps: [
    "確認簽約金入帳", "提供品牌行銷規範", "建立素材審核群組", "客戶提交素材", "內部／CCC廣報審核", "修正或核准", "依核准內容發布"
  ]},
  { name: "選書規劃", steps: [
    "彙整選書需求", "製作進場書單", "BD／MD內部確認", "客戶確認與回饋", "書單調整", "最終書單確認"
  ]},
  { name: "書籍採購", steps: [
    "最終書單確認", "向供應商詢價／詢庫存", "提出採購", "確認缺書與停版品", "提供替代書", "客戶或內部確認", "集貨及到貨清點", "最終出貨確認"
  ]},
  { name: "進場前置", steps: [
    "T-60～45天 確認使照、公設點交及可能進場月份",
    "T-45～30天 確認書架及空間是否變更",
    "T-30天 完成選書與主要採購",
    "T-21～14天 確認進場日期、人力及物流",
    "T-7天 提供進場書單及作業通知",
    "T-3～1天 確認書籍到貨、現場條件及驗收代表",
    "T日進場陳列與驗收"
  ]},
  { name: "進場日及後續", steps: [
    "人員到場與現場確認", "清點到貨箱數", "拆箱與商品清點", "依分類配置書籍", "上架陳列",
    "視覺平衡微調", "客戶抽點驗收", "簽收確認", "尾款請款"
  ]},
  { name: "維護管理", steps: [
    "維護需求確認", "選書作業", "書單確認", "書單微調", "商品採購", "商品配送", "人力安排", "流程通知", "維護更新", "驗收簽認"
  ]}
];

const STAGE_NAMES = STAGE_DEFS.map(s => s.name);
const TOTAL_STEPS = STAGE_DEFS.reduce((a, s) => a + s.steps.length, 0);

const STATUS = { none: "未開始", wip: "進行中", done: "完成" };
const STATUS_ORDER = ["none", "wip", "done"];
const STORAGE_KEY = "bookstore_onboarding_pm_v1";

/* =========================================================
   2. 工具函式
   ========================================================= */
function uid() {
  return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function todayISO() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

/* 建立空白步驟 */
function makeSteps(stageIdx) {
  return STAGE_DEFS[stageIdx].steps.map((t, i) => ({
    id: "s" + stageIdx + "_" + i + "_" + Math.random().toString(36).slice(2, 7),
    text: t,
    status: "none",
    owner: "",
    due: ""
  }));
}

/* 建立新案件 */
function makeCase(init) {
  init = init || {};
  const stages = STAGE_DEFS.map((s, i) => ({
    name: s.name,
    open: i === 0,
    steps: makeSteps(i)
  }));
  return {
    id: uid(),
    code: init.code || nextCaseCode(),
    customer: init.customer || "",
    project: init.project || "",
    contact: init.contact || "",
    contactInfo: init.contactInfo || "",
    enterDate: init.enterDate || "",
    note: init.note || "",
    createdAt: todayISO(),
    stages: stages
  };
}

/* 自動案件編號：BK-YYYYMM-### */
function nextCaseCode() {
  const d = new Date();
  const ym = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0");
  const prefix = "BK-" + ym + "-";
  let max = 0;
  state.cases.forEach(c => {
    if (c.code && c.code.indexOf(prefix) === 0) {
      const n = parseInt(c.code.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + String(max + 1).padStart(3, "0");
}

/* =========================================================
   3. 完成率計算
   ========================================================= */
function stageProgress(c, si) {
  const st = c.stages[si];
  if (!st || !st.steps.length) return 0;
  const done = st.steps.filter(x => x.status === "done").length;
  return done / st.steps.length;
}
function stageDoneCount(c, si) {
  return c.stages[si].steps.filter(x => x.status === "done").length;
}
function caseProgress(c) {
  let done = 0, total = 0;
  c.stages.forEach(st => {
    st.steps.forEach(x => { total++; if (x.status === "done") done++; });
  });
  return total ? done / total : 0;
}
function caseDoneCount(c) {
  let n = 0;
  c.stages.forEach(st => st.steps.forEach(x => { if (x.status === "done") n++; }));
  return n;
}
/* 目前階段＝第一個尚未全部完成的階段；全部完成回傳最後一階段 */
function currentStage(c) {
  for (let i = 0; i < c.stages.length; i++) {
    if (stageDoneCount(c, i) < c.stages[i].steps.length) return STAGE_NAMES[i];
  }
  return STAGE_NAMES[STAGE_NAMES.length - 1];
}
/* 案件狀態：未開始(0進度)／進行中／已完成(100%) */
function caseStatus(c) {
  const p = caseProgress(c);
  if (p >= 1) return "done";
  if (p <= 0) return "none";
  return "wip";
}
function caseStatusLabel(c) {
  const s = caseStatus(c);
  return s === "done" ? "已完成" : (s === "none" ? "未開始" : "進行中");
}

/* 最近到期日：所有未完成且有日期之步驟中最小者 */
function nextDue(c) {
  let min = null;
  c.stages.forEach(st => st.steps.forEach(s => {
    if (s.status !== "done" && s.due) {
      if (!min || s.due < min) min = s.due;
    }
  }));
  return min;
}
/* 逾期數：未完成、有日期、且日期 < 今天 */
function overdueCount(c) {
  const t = todayISO();
  let n = 0;
  c.stages.forEach(st => st.steps.forEach(s => {
    if (s.status !== "done" && s.due && s.due < t) n++;
  }));
  return n;
}
/* 負責人彙總 */
function ownersOf(c) {
  const m = {};
  c.stages.forEach(st => st.steps.forEach(s => {
    const o = (s.owner || "").trim();
    if (o) m[o] = (m[o] || 0) + 1;
  }));
  return Object.keys(m).sort((a, b) => m[b] - m[a]);
}

/* =========================================================
   4. 狀態與儲存（localStorage）
   ========================================================= */
let state = { cases: [], view: "home", currentId: null };
let filters = { q: "", stage: "all", status: "all" };

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: 1,
      savedAt: new Date().toISOString(),
      cases: state.cases
    }));
  } catch (e) {
    console.warn("儲存失敗", e);
    toast("資料儲存失敗，請確認瀏覽器允許本機儲存");
  }
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.cases)) return false;
    state.cases = data.cases.map(normalizeCase);
    return true;
  } catch (e) {
    console.warn("讀取失敗", e);
    return false;
  }
}

/* 匯入或載入時校正結構，確保 9 階段與步驟文字與範本一致 */
function normalizeCase(c) {
  const out = {
    id: c.id || uid(),
    code: c.code || "",
    customer: c.customer || "",
    project: c.project || "",
    contact: c.contact || "",
    contactInfo: c.contactInfo || "",
    enterDate: c.enterDate || "",
    note: c.note || "",
    createdAt: c.createdAt || todayISO(),
    stages: []
  };
  for (let i = 0; i < STAGE_DEFS.length; i++) {
    const src = (c.stages && c.stages[i]) ? c.stages[i] : {};
    const srcSteps = Array.isArray(src.steps) ? src.steps : [];
    const steps = STAGE_DEFS[i].steps.map((txt, j) => {
      const s = srcSteps[j] || {};
      const st = STATUS_ORDER.indexOf(s.status) >= 0 ? s.status : "none";
      return {
        id: s.id || ("s" + i + "_" + j + "_" + Math.random().toString(36).slice(2, 7)),
        text: txt,
        status: st,
        owner: s.owner || "",
        due: s.due || ""
      };
    });
    out.stages.push({ name: STAGE_DEFS[i].name, open: src.open !== false && i === 0 ? true : !!src.open, steps: steps });
  }
  return out;
}

function getCase(id) {
  return state.cases.filter(c => c.id === id)[0] || null;
}

/* =========================================================
   5. 介面共用：Toast / Modal
   ========================================================= */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalMask").classList.add("show");
}
function closeModal() {
  document.getElementById("modalMask").classList.remove("show");
  document.getElementById("modalBox").innerHTML = "";
}

/* =========================================================
   6. 渲染路由
   ========================================================= */
function render() {
  const view = document.getElementById("view");
  if (state.view === "detail" && getCase(state.currentId)) {
    view.innerHTML = renderDetailHTML(getCase(state.currentId));
    bindDetail(getCase(state.currentId));
  } else {
    state.view = "home";
    view.innerHTML = renderHomeHTML();
    bindHome();
  }
  syncTopbar();
}

function syncTopbar() {
  const onDetail = state.view === "detail";
  document.getElementById("btnHome").style.display = onDetail ? "" : "none";
}

/* =========================================================
   7. 總覽頁（首頁）
   ========================================================= */
function kpiHTML() {
  const total = state.cases.length;
  const done = state.cases.filter(c => caseStatus(c) === "done").length;
  const wip = state.cases.filter(c => caseStatus(c) === "wip").length;
  const none = state.cases.filter(c => caseStatus(c) === "none").length;
  let avg = 0;
  if (total) {
    avg = state.cases.reduce((a, c) => a + caseProgress(c), 0) / total;
  }
  return '' +
  '<div class="kpis">' +
    '<div class="kpi k1"><div class="lbl">案件總數</div><div class="val">' + total + '<small>件</small></div>' +
      '<div class="foot">未開始 ' + none + ' 件</div></div>' +
    '<div class="kpi k2"><div class="lbl">進行中</div><div class="val">' + wip + '<small>件</small></div>' +
      '<div class="foot">尚未全部完成之案件</div></div>' +
    '<div class="kpi k3"><div class="lbl">已完成</div><div class="val">' + done + '<small>件</small></div>' +
      '<div class="foot">整體完成率 100%</div></div>' +
    '<div class="kpi k4"><div class="lbl">平均整體完成率</div><div class="val">' + pct(avg) + '<small>%</small></div>' +
      '<div class="foot">' + TOTAL_STEPS + ' 個步驟／案件</div></div>' +
  '</div>';
}

function pct(x) { return Math.round(x * 100); }

function filteredCases() {
  const q = filters.q.trim().toLowerCase();
  return state.cases.filter(c => {
    if (q) {
      const hay = (c.code + " " + c.customer + " " + (c.project || "")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    if (filters.stage !== "all" && currentStage(c) !== filters.stage) return false;
    if (filters.status !== "all" && caseStatus(c) !== filters.status) return false;
    return true;
  });
}

function statusBadge(st) {
  const map = { none: ["gray", "未開始"], wip: ["blue", "進行中"], done: ["green", "已完成"] };
  const m = map[st] || map.none;
  return '<span class="badge ' + m[0] + '"><span class="dot" style="background:currentColor"></span>' + m[1] + '</span>';
}

function progressCell(v) {
  const p = pct(v);
  const color = p >= 100 ? "var(--green)" : (p === 0 ? "var(--gray)" : "var(--blue)");
  return '<div class="pbar-wrap"><div class="pbar"><i style="width:' + p + '%;background:' + color + '"></i></div>' +
    '<span class="pbar-val">' + p + '%</span></div>';
}

function renderCaseRow(c) {
  const st = caseStatus(c);
  const v = caseProgress(c);
  const due = nextDue(c);
  const ov = overdueCount(c);
  const owners = ownersOf(c);
  let ownerTxt;
  if (!owners.length) {
    ownerTxt = '<span class="muted">未指派</span>';
  } else {
    const shown = owners.slice(0, 2).map(o => '<span class="chip">' + esc(o) + '</span>').join("");
    const more = owners.length > 2 ? '<span class="chip">+' + (owners.length - 2) + '</span>' : '';
    ownerTxt = '<div class="chips">' + shown + more + '</div>';
  }
  let dueTxt;
  if (ov > 0) {
    dueTxt = '<div class="overdue-txt">逾期 ' + ov + ' 項</div><div class="muted">' + (due ? "最近到期 " + esc(due) : "無到期日") + '</div>';
  } else if (due) {
    const t = todayISO();
    const near = due >= t && dayDiff(t, due) <= 7;
    dueTxt = '<div' + (near ? ' style="color:var(--amber);font-weight:700"' : '') + '>' + esc(due) + '</div>';
  } else {
    dueTxt = '<span class="muted">—</span>';
  }
  const cid = esc(c.id);
  return '<tr data-id="' + cid + '">' +
    '<td><span class="case-no">' + esc(c.code || "（未編號）") + '</span></td>' +
    '<td><div class="cust">' + esc(c.customer || "（未填客戶）") + '</div>' +
      (c.project ? '<div class="muted">' + esc(c.project) + '</div>' : '') + '</td>' +
    '<td>' + (st === "done" ? '<span class="badge green">已完成</span>' : esc(currentStage(c))) + '</td>' +
    '<td>' + progressCell(v) + '</td>' +
    '<td>' + ownerTxt + '</td>' +
    '<td>' + dueTxt + '</td>' +
    '<td>' + statusBadge(st) + '</td>' +
    '<td><button class="btn sm" data-open="' + cid + '">開啟明細</button></td>' +
  '</tr>';
}

function dayDiff(a, b) {
  const da = new Date(a + "T00:00:00"), db = new Date(b + "T00:00:00");
  return Math.round((db - da) / 86400000);
}

function renderHomeHTML() {
  const list = filteredCases();
  const stageOpts = STAGE_NAMES.map(n =>
    '<option value="' + esc(n) + '"' + (filters.stage === n ? " selected" : "") + '>' + esc(n) + '</option>').join("");

  let rows;
  if (!state.cases.length) {
    rows = '<tr><td colspan="8"><div class="empty"><div class="big">📚</div>' +
      '<div>尚無案件資料，請點右上角「＋ 新增案件」開始。</div></div></td></tr>';
  } else if (!list.length) {
    rows = '<tr><td colspan="8"><div class="empty"><div class="big">🔍</div>' +
      '<div>沒有符合篩選條件的案件。</div></div></td></tr>';
  } else {
    rows = list.map(renderCaseRow).join("");
  }

  const compareCard = state.cases.length
    ? '<div class="card card-pad" style="margin-top:18px;">' +
        '<div class="section-title">各案件整體完成率比較 <span class="sub">共 ' + state.cases.length + ' 件</span></div>' +
        compareChartHTML() +
      '</div>'
    : '';

  return kpiHTML() +
    '<div class="card">' +
      '<div class="toolbar">' +
        '<div class="search"><span class="ico">🔍</span>' +
          '<input class="input" id="fQ" placeholder="搜尋案件編號或客戶名稱" value="' + esc(filters.q) + '"></div>' +
        '<div class="field"><label>階段</label><select class="input" id="fStage">' +
          '<option value="all">全部階段</option>' + stageOpts + '</select></div>' +
        '<div class="field"><label>狀態</label><select class="input" id="fStatus">' +
          '<option value="all">全部狀態</option>' +
          '<option value="none"' + (filters.status === "none" ? " selected" : "") + '>未開始</option>' +
          '<option value="wip"' + (filters.status === "wip" ? " selected" : "") + '>進行中</option>' +
          '<option value="done"' + (filters.status === "done" ? " selected" : "") + '>已完成</option>' +
        '</select></div>' +
        '<div class="grow"></div>' +
        '<div class="muted">顯示 ' + list.length + ' / ' + state.cases.length + ' 件</div>' +
        '<button class="btn sm" id="fClear">清除篩選</button>' +
      '</div>' +
      '<div class="table-wrap"><table class="tbl">' +
        '<thead><tr>' +
          '<th>案件編號</th><th>客戶名稱</th><th>目前階段</th><th>整體完成率</th>' +
          '<th>負責人彙總</th><th>最近到期／逾期</th><th>狀態</th><th>操作</th>' +
        '</tr></thead><tbody>' + rows + '</tbody>' +
      '</table></div>' +
    '</div>' + compareCard;
}

/* 各案件整體完成率比較圖（自繪） */
function compareChartHTML() {
  const arr = state.cases.slice().sort((a, b) => caseProgress(b) - caseProgress(a));
  return '<div class="bar-chart">' + arr.map(c => {
    const p = pct(caseProgress(c));
    const color = p >= 100 ? "var(--green)" : (p === 0 ? "var(--gray)" : "var(--blue)");
    const label = (c.code || c.customer || "未命名");
    return '<div class="bar-row">' +
      '<div class="bl" title="' + esc(c.customer) + '">' + esc(label) + '</div>' +
      '<div class="pbar lg"><i style="width:' + p + '%;background:' + color + '"></i></div>' +
      '<div class="bv">' + p + '%</div>' +
    '</div>';
  }).join("") + '</div>';
}

/* =========================================================
   8. 總覽頁事件
   ========================================================= */
function bindHome() {
  const fq = document.getElementById("fQ");
  if (fq) {
    fq.addEventListener("input", function () {
      filters.q = this.value;
      const pos = this.selectionStart;
      render();
      const el = document.getElementById("fQ");
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    });
  }
  const fs = document.getElementById("fStage");
  if (fs) fs.addEventListener("change", function () { filters.stage = this.value; render(); });
  const ft = document.getElementById("fStatus");
  if (ft) ft.addEventListener("change", function () { filters.status = this.value; render(); });
  const fc = document.getElementById("fClear");
  if (fc) fc.addEventListener("click", function () {
    filters = { q: "", stage: "all", status: "all" };
    render();
  });

  document.querySelectorAll("#view tbody tr[data-id]").forEach(tr => {
    tr.addEventListener("click", function (e) {
      const openBtn = e.target.closest("[data-open]");
      const id = openBtn ? openBtn.getAttribute("data-open") : this.getAttribute("data-id");
      goDetail(id);
    });
  });
}

function goDetail(id) {
  state.view = "detail";
  state.currentId = id;
  window.scrollTo(0, 0);
  render();
}

function fieldHTML(label, key, val, type) {
  return '<div class="field"><label>' + esc(label) + '</label>' +

}

function statusColor(st) {
  return st === "done" ? "var(--green)" : (st === "none" ? "var(--gray)" : "var(--blue)");
}

/* 圓環圖（自繪 SVG） */
function donutSVG(percent, size, stroke) {
  const r = (size - stroke) / 2;
  const cx = size / 2, cy = size / 2;
  const C = 2 * Math.PI * r;
  const off = C * (1 - Math.min(1, Math.max(0, percent / 100)));
  const col = percent >= 100 ? "#16a34a" : (percent === 0 ? "#9aa4b2" : "#2563eb");
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#eef1f6" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="' + stroke + '"' +
      ' stroke-linecap="round" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"' +
      ' transform="rotate(-90 ' + cx + ' ' + cy + ')"/>' +
  '</svg>';
}

/* 各階段完成率長條圖 */
function stageBarChartHTML(c) {
  return '<div class="bar-chart">' + c.stages.map((s, i) => {
    const p = pct(stageProgress(c, i));
    const color = p >= 100 ? "var(--green)" : (p === 0 ? "var(--gray)" : "var(--blue)");
    return '<div class="bar-row">' +
      '<div class="bl" title="' + esc(s.name) + '">' + (i + 1) + '. ' + esc(s.name) + '</div>' +
      '<div class="pbar"><i style="width:' + p + '%;background:' + color + '"></i></div>' +
      '<div class="bv">' + p + '%</div>' +
    '</div>';
  }).join("") + '</div>';
}

/* 單一階段區塊 */
function stageHTML(c, i) {
  const s = c.stages[i];
  const p = pct(stageProgress(c, i));
  const color = p >= 100 ? "var(--green)" : (p === 0 ? "var(--gray)" : "var(--blue)");
  const done = stageDoneCount(c, i);
  const steps = s.steps.map((st, j) => stepRowHTML(c, i, j, st)).join("");
  return '<div class="stage' + (s.open ? " open" : "") + '" data-stage="' + i + '">' +
    '<div class="stage-head" data-toggle="' + i + '">' +
      '<span class="num">' + (i + 1) + '</span>' +
      '<span class="name">' + esc(s.name) + '</span>' +
      '<span class="badge ' + (p >= 100 ? "green" : (p === 0 ? "gray" : "blue")) + '">' + done + ' / ' + s.steps.length + ' 步</span>' +
      '<span class="sp"></span>' +
      '<span class="pbar" style="width:150px;"><i style="width:' + p + '%;background:' + color + '"></i></span>' +
      '<span class="pbar-val">' + p + '%</span>' +
      '<span class="arrow">▶</span>' +
    '</div>' +
    '<div class="stage-body">' + steps + '</div>' +
  '</div>';
}

/* 單一步驟列 */
function stepRowHTML(c, i, j, st) {
  const t = todayISO();
  const overdue = st.status !== "done" && st.due && st.due < t;
  const cls = st.status === "done" ? "is-done" : (st.status === "wip" ? "is-wip" : "");
  const seg = STATUS_ORDER.map(k =>
    '<button data-s="' + k + '"' + (st.status === k ? ' class="on"' : "") + '>' + STATUS[k] + '</button>').join("");
  return '<div class="step-row ' + cls + '" data-i="' + i + '" data-j="' + j + '">' +
    '<div class="idx">' + (j + 1) + '</div>' +
    '<div class="txt">' + esc(st.text) +
      (overdue ? ' <span class="overdue-txt">（已逾期）</span>' : '') + '</div>' +
    '<div class="cell-seg"><span class="seg" data-seg>' + seg + '</span></div>' +
    '<div class="cell-own"><input class="own" data-own placeholder="負責人" value="' + esc(st.owner) + '"></div>' +
    '<div class="cell-due"><input class="dt" data-due type="date" value="' + esc(st.due) + '"></div>' +
  '</div>';
}



/* =========================================================
   10. 明細頁事件與即時更新
   ========================================================= */
function bindDetail(c) {
  const back = document.getElementById("dBack");
  if (back) back.addEventListener("click", function () {
    state.view = "home"; state.currentId = null; window.scrollTo(0, 0); render();
  });

  /* 基本資料欄位 */
  document.querySelectorAll("#view [data-field]").forEach(inp => {
    inp.addEventListener("input", function () {
      const key = this.getAttribute("data-field");
      c[key] = this.value;
      save();
      updateDetailTitles(c);
    });
  });
  const noteEl = document.getElementById("f_note");
  if (noteEl) noteEl.addEventListener("input", function () { c.note = this.value; save(); });

  /* 展開／收合全部 */
  const ex = document.getElementById("dExpand");
  if (ex) ex.addEventListener("click", function () {
    c.stages.forEach(s => { s.open = true; });
    save();
    document.querySelectorAll("#stagesWrap .stage").forEach(el => el.classList.add("open"));
  });
  const co = document.getElementById("dCollapse");
  if (co) co.addEventListener("click", function () {
    c.stages.forEach(s => { s.open = false; });
    save();
    document.querySelectorAll("#stagesWrap .stage").forEach(el => el.classList.remove("open"));
  });

  /* 階段標題：展開切換 */
  document.querySelectorAll("#stagesWrap .stage-head").forEach(head => {
    head.addEventListener("click", function () {
      const idx = parseInt(this.getAttribute("data-toggle"), 10);
      const box = this.closest(".stage");
      const open = box.classList.toggle("open");
      c.stages[idx].open = open;
      save();
    });
  });

  /* 步驟列事件 */
  document.querySelectorAll("#stagesWrap .step-row").forEach(row => {
    const i = parseInt(row.getAttribute("data-i"), 10);
    const j = parseInt(row.getAttribute("data-j"), 10);
    const step = c.stages[i].steps[j];

    /* 狀態三段切換 */
    row.querySelectorAll("[data-seg] button").forEach(btn => {
      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        const s = this.getAttribute("data-s");
        step.status = s;
        row.querySelectorAll("[data-seg] button").forEach(b => b.classList.remove("on"));
        this.classList.add("on");
        row.classList.remove("is-done", "is-wip");
        if (s === "done") row.classList.add("is-done");
        if (s === "wip") row.classList.add("is-wip");
        /* 移除／顯示逾期提示 */
        const txt = row.querySelector(".txt");
        const has = txt.querySelector(".overdue-txt");
        if (has) has.remove();
        refreshDetail(c);
        save();
      });
    });

    /* 負責人 */
    const own = row.querySelector("[data-own]");
    if (own) own.addEventListener("input", function () { step.owner = this.value; save(); });

    /* 預計完成日 */
    const due = row.querySelector("[data-due]");
    if (due) due.addEventListener("change", function () {
      step.due = this.value;
      save();
      refreshDetail(c);
    });
  });

  /* 刪除案件（二次確認） */
  const del = document.getElementById("dDelete");
  if (del) del.addEventListener("click", function () {
    openModal(
      '<div class="modal-head"><h3>刪除案件</h3><button class="x" id="mX">✕</button></div>' +
      '<div class="modal-body"><p style="margin:0 0 8px;">確定要刪除以下案件嗎？此動作無法復原。</p>' +
        '<div class="kv"><div class="k">案件編號</div><div>' + esc(c.code) + '</div>' +
        '<div class="k">客戶名稱</div><div>' + esc(c.customer) + '</div>' +
        '<div class="k">完成進度</div><div>' + pct(caseProgress(c)) + '%（' + caseDoneCount(c) + ' / ' + TOTAL_STEPS + ' 步）</div></div>' +
      '</div>' +
      '<div class="modal-foot left"><span class="hint">刪除後僅能透過先前匯出的備份還原。</span>' +
        '<span class="row"><button class="btn" id="mCancel">取消</button>' +
        '<button class="btn danger" id="mOk">確認刪除</button></span></div>'
    );
    document.getElementById("mX").onclick = closeModal;
    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mOk").onclick = function () {
      state.cases = state.cases.filter(x => x.id !== c.id);
      save();
      closeModal();
      state.view = "home"; state.currentId = null;
      render();
      toast("案件已刪除");
    };
  });
}

/* 更新標題（客戶／編號／專案）而不重建輸入欄位 */
function updateDetailTitles(c) {
  const h2 = document.querySelector(".detail-head h2");
  const sub = document.querySelector(".detail-head .muted");
  if (h2) h2.textContent = c.customer || "（未填客戶）";
  if (sub) sub.textContent = (c.code || "（未編號）") + (c.project ? " ・ " + c.project : "");
}

/* 重新計算並更新完成率與所有圖表 */
function refreshDetail(c) {
  const p = pct(caseProgress(c));
  const st = caseStatus(c);

  const hs = document.getElementById("dHeaderStatus");
  if (hs) hs.innerHTML = statusBadge(st);
  const hd = document.getElementById("dHeaderDonut");
  if (hd) hd.innerHTML = donutSVG(p, 76, 9) +
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;">' + p + '%</div>';

  const bd = document.getElementById("dBigDonut");
  if (bd) bd.innerHTML = donutSVG(p, 150, 18) +
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">' +
      '<div style="font-size:32px;font-weight:800;line-height:1;">' + p + '%</div>' +
      '<div class="muted" style="font-size:11.5px;margin-top:3px;">' + caseDoneCount(c) + ' / ' + TOTAL_STEPS + ' 步驟</div>' +
    '</div>';

  const bl = document.getElementById("dBigDonutLegend");
  if (bl) bl.innerHTML =
    '<span><i style="background:' + statusColor(st) + '"></i>' + caseStatusLabel(c) + '</span>' +
    '<span><i style="background:var(--gray-bg)"></i>未完成 ' + (TOTAL_STEPS - caseDoneCount(c)) + ' 步</span>';

  const sc = document.getElementById("dStageChart");
  if (sc) sc.innerHTML = stageBarChartHTML(c);

  /* 各階段標題的進度條與徽章 */
  document.querySelectorAll("#stagesWrap .stage").forEach(box => {
    const i = parseInt(box.getAttribute("data-stage"), 10);
    const sp = pct(stageProgress(c, i));
    const done = stageDoneCount(c, i);
    const total = c.stages[i].steps.length;
    const color = sp >= 100 ? "var(--green)" : (sp === 0 ? "var(--gray)" : "var(--blue)");
    const badge = box.querySelector(".stage-head .badge");
    if (badge) {
      badge.className = "badge " + (sp >= 100 ? "green" : (sp === 0 ? "gray" : "blue"));
      badge.textContent = done + " / " + total + " 步";
    }
    const bar = box.querySelector(".stage-head .pbar > i");
    if (bar) { bar.style.width = sp + "%"; bar.style.background = color; }
    const pv = box.querySelector(".stage-head .pbar-val");
    if (pv) pv.textContent = sp + "%";
  });

  updateDetailTitles(c);
}

/* =========================================================
   11. 新增案件
   ========================================================= */
function openNewCase() {
  openModal(
    '<div class="modal-head"><h3>新增案件</h3><button class="x" id="mX">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="grid-form" style="grid-template-columns:repeat(2,1fr)">' +
        '<div class="field"><label>案件編號</label><input class="input" id="nCode" value="' + esc(nextCaseCode()) + '"></div>' +
        '<div class="field"><label>客戶名稱 *</label><input class="input" id="nCustomer" placeholder="例：誠品生活 松菸店"></div>' +
        '<div class="field full"><label>專案名稱</label><input class="input" id="nProject" placeholder="例：松菸店書區進場專案"></div>' +
        '<div class="field"><label>聯絡人</label><input class="input" id="nContact"></div>' +
        '<div class="field"><label>聯絡方式</label><input class="input" id="nContactInfo" placeholder="電話或 Email"></div>' +
        '<div class="field"><label>預計進場日</label><input class="input" id="nEnterDate" type="date"></div>' +
        '<div class="field"><label>備註</label><input class="input" id="nNote"></div>' +
      '</div>' +
      '<div class="hint" style="margin-top:12px;">建立後將自動產生 9 階段共 ' + TOTAL_STEPS + ' 個步驟，狀態預設為「未開始」。</div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn" id="mCancel">取消</button>' +
      '<button class="btn primary" id="mOk">建立案件</button></div>'
  );
  document.getElementById("mX").onclick = closeModal;
  document.getElementById("mCancel").onclick = closeModal;
  const custInput = document.getElementById("nCustomer");
  if (custInput) custInput.focus();
  document.getElementById("mOk").onclick = function () {
    const customer = document.getElementById("nCustomer").value.trim();
    if (!customer) { toast("請填寫客戶名稱"); document.getElementById("nCustomer").focus(); return; }
    const c = makeCase({
      code: document.getElementById("nCode").value.trim(),
      customer: customer,
      project: document.getElementById("nProject").value.trim(),
      contact: document.getElementById("nContact").value.trim(),
      contactInfo: document.getElementById("nContactInfo").value.trim(),
      enterDate: document.getElementById("nEnterDate").value,
      note: document.getElementById("nNote").value.trim()
    });
    state.cases.push(c);
    save();
    closeModal();
    filters = { q: "", stage: "all", status: "all" };
    goDetail(c.id);
    toast("已建立案件：" + c.code);
  };
}

/* =========================================================
   12. 匯出／匯入 JSON
   ========================================================= */
function exportJSON() {
  const payload = {
    app: "書店進場專案管理",
    version: 1,
    exportedAt: new Date().toISOString(),
    caseCount: state.cases.length,
    cases: state.cases
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  a.href = url;
  a.download = "書店進場專案備份-" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast("已匯出 " + state.cases.length + " 筆案件備份");
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = function () {
    let data;
    try { data = JSON.parse(reader.result); }
    catch (e) { toast("匯入失敗：檔案不是有效的 JSON"); return; }
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.cases) ? data.cases : null);
    if (!arr) { toast("匯入失敗：找不到案件資料（cases）"); return; }
    if (!arr.length) { toast("匯入的檔案沒有案件資料"); return; }

    openModal(
      '<div class="modal-head"><h3>匯入備份</h3><button class="x" id="mX">✕</button></div>' +
      '<div class="modal-body"><p style="margin:0 0 8px;">偵測到 <b>' + arr.length + '</b> 筆案件資料，請選擇匯入方式：</p>' +
        '<div class="kv"><div class="k">目前案件</div><div>' + state.cases.length + ' 筆</div>' +
        '<div class="k">備份檔案</div><div>' + arr.length + ' 筆</div>' +
        (data && data.exportedAt ? '<div class="k">匯出時間</div><div>' + esc(data.exportedAt.replace("T", " ").slice(0, 16)) + '</div>' : '') +
        '</div></div>' +
      '<div class="modal-foot left"><button class="btn" id="mCancel">取消</button>' +
        '<span class="row"><button class="btn" id="mMerge">合併（保留現有）</button>' +
        '<button class="btn primary" id="mReplace">覆蓋全部</button></span></div>'
    );
    document.getElementById("mX").onclick = closeModal;
    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mReplace").onclick = function () {
      state.cases = arr.map(normalizeCase);
      save();
      closeModal();
      state.view = "home"; state.currentId = null;
      render();
      toast("已覆蓋匯入 " + state.cases.length + " 筆案件");
    };
    document.getElementById("mMerge").onclick = function () {
      const existingIds = {};
      state.cases.forEach(c => { existingIds[c.id] = true; });
      let added = 0;
      arr.map(normalizeCase).forEach(nc => {
        if (existingIds[nc.id]) { nc.id = uid(); }
        state.cases.push(nc);
        added++;
      });
      save();
      closeModal();
      state.view = "home"; state.currentId = null;
      render();
      toast("已合併新增 " + added + " 筆案件");
    };
  };
  reader.onerror = function () { toast("匯入失敗：無法讀取檔案"); };
  reader.readAsText(file, "utf-8");
}

/* =========================================================
   13. 全域事件與初始化
   ========================================================= */
function bindGlobal() {
  document.getElementById("btnNew").addEventListener("click", openNewCase);
  document.getElementById("btnHome").addEventListener("click", function () {
    state.view = "home"; state.currentId = null; window.scrollTo(0, 0); render();
  });
  document.getElementById("btnExport").addEventListener("click", exportJSON);

  const fileInput = document.getElementById("fileInput");
  document.getElementById("btnImport").addEventListener("click", function () { fileInput.value = ""; fileInput.click(); });
  fileInput.addEventListener("change", function () {
    if (this.files && this.files[0]) importJSON(this.files[0]);
  });

  document.getElementById("modalMask").addEventListener("click", function (e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
  });
}

function init() {
  const ok = load();
  if (!ok) {
    seedDemo();
    save();
  }
  bindGlobal();
  render();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
/* ===== APP CODE END ===== */

</script>
</body>
</html>
